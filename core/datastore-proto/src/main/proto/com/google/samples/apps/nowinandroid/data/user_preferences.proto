syntax = "proto3";

import "com/google/samples/apps/nowinandroid/data/dark_theme_config.proto";
import "com/google/samples/apps/nowinandroid/data/theme_brand.proto";
import "com/google/samples/apps/nowinandroid/data/wiki_reader_text_scale.proto";

option java_package = "com.google.samples.apps.nowinandroid.core.datastore";
option java_multiple_files = true;

message UserPreferences {
    // Former NiA news/topics/sync preference fields. Kept reserved so old payloads decode safely.
    reserved 1 to 15, 20;
    reserved
        "deprecated_int_followed_topic_ids",
        "topicChangeListVersion",
        "authorChangeListVersion",
        "newsResourceChangeListVersion",
        "deprecated_int_followed_author_ids",
        "has_done_int_to_string_id_migration",
        "deprecated_followed_topic_ids",
        "deprecated_followed_author_ids",
        "deprecated_bookmarked_news_resource_ids",
        "has_done_list_to_map_migration",
        "followed_topic_ids",
        "followed_author_ids",
        "bookmarked_news_resource_ids",
        "viewed_news_resource_ids";

    ThemeBrandProto theme_brand = 16;
    DarkThemeConfigProto dark_theme_config = 17;

    bool should_hide_onboarding = 18;

    bool use_dynamic_color = 19;

    string preferred_wiki_language = 21;

    WikiReaderTextScaleProto wiki_reader_text_scale = 22;

    // NEXT AVAILABLE ID: 23
}
