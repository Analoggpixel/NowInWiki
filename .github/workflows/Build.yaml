name: Build

# Lean CI for the NowInWiki personal/learning repo.
# Upstream Now in Android checks (spotless gate, screenshots, full androidTest matrix,
# dependency-guard auto-commit, badging) are intentionally omitted for now.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Compile and assemble demoDebug"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check build-logic
        run: ./gradlew :build-logic:convention:check

      - name: Compile app (demoDebug)
        run: ./gradlew :app:compileDemoDebugKotlin

      - name: Assemble demoDebug APK
        run: ./gradlew :app:assembleDemoDebug -PminifyWithR8=false

      - name: Upload demoDebug APK
        uses: actions/upload-artifact@v4
        with:
          name: demo-debug-apk
          path: 'app/build/outputs/apk/demo/debug/**/*.apk'
          if-no-files-found: warn
